name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, test, lint)
    runs-on: ubuntu-latest
    # Postgres for the integration tests (internal/db/dbtest creates one
    # throwaway database per test; without TEST_DATABASE_URL they are skipped).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # Go version comes from backend/go.mod (1.26, same as backend/Dockerfile).
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Test
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://app:app@localhost:5432/postgres?sslmode=disable
        run: go test ./...

      # Config: backend/.golangci.yml (v2 schema).
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: backend

  frontend:
    name: Frontend (typecheck, lint, format, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 matches the frontend build stage in backend/Dockerfile.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (oxlint)
        run: npm run lint

      - name: Format check (oxfmt)
        run: npm run format:check

      - name: Test (vitest)
        run: npm run test:run
