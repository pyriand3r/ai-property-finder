# Docker Compose — Property Finder OBS-Style.
# Single-user, self-hosted, local-network app. No reverse proxy.
#
# Bring up:   docker compose up -d --build
# DB shell:   docker compose exec db psql -U app -d propertyfinder
# Logs:       docker compose logs -f backend
#
# See docs/spec/00_infrastructure_setup/00-01-tech-stack.md "Deployment".

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: propertyfinder
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Exposed to the host so `psql -h localhost` works for local dev/tests
      # (Layer 0.1). Fine for a local-network-only app; drop this if the DB
      # should never be host-reachable.
      - "5432:5432"
    volumes:
      # Postgres 18's image expects the volume at /var/lib/postgresql (not
      # .../data) — it manages the version-specific data subdirectory itself.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d propertyfinder"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app:${DB_PASSWORD}@db:5432/propertyfinder?sslmode=disable
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
